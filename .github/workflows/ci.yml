name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test dependencies
        run: pip install -e ".[test]"

      - name: Run tests
        run: pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install -e ".[lint]"

      - name: Run ruff
        run: ruff check .

  notebooks:
    # Final step, after tests pass: execute the cosimita example notebooks
    # as a smoke check. pytest never imports or runs a notebook, so a
    # breaking refactor (e.g. gammaraytoys/sims/transform.py moving to
    # gammaraytoys/coordinates/) can pass the full test suite while a
    # notebook still fails on import. This is a development-time stand-in
    # for that coverage -- it should eventually be replaced by proper
    # lightweight unit tests exercising the same code paths, but running
    # the real notebooks is fine for now.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and notebook execution tools
        run: |
          pip install -e ".[test]"
          pip install jupyter nbconvert ipykernel

      - name: Execute cosimita example notebooks
        env:
          # Non-interactive backend: a notebook that tries to pop up a GUI
          # window can never hang the runner waiting for a display.
          MPLBACKEND: Agg
        run: |
          set -e
          for nb in docs/examples/cosimita/*.ipynb; do
            echo "::group::Executing $nb"
            jupyter nbconvert --to notebook --execute --stdout \
              --ExecutePreprocessor.timeout=180 "$nb" > /dev/null
            echo "::endgroup::"
          done
